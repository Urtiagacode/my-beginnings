<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Garage Wars</title>

    <link rel="stylesheet" href="style.css">


    <script
        src="https://carimagesapi.com/assets/js/carimages.js"
        data-api-key="ci_766b593b61e1b13f50791f1bf430a9ef1d2d74a3de090c84398b36ad">
    </script>
</head>

<body>

<div class="background-glow"></div>


<section id="startScreen" class="start-screen">

    <div class="start-card">

        <div class="start-logo">
            <span>GARAGE</span>
            <strong>WARS</strong>
        </div>

        <p class="start-subtitle">
            QUI JOUE ?
        </p>

        <div class="players-inputs">

            <div class="player-input">

                <label>JOUEUR 1</label>

                <input
                    type="text"
                    id="player1Name"
                    placeholder="Ton nom"
                    maxlength="15"
                    autocomplete="off"
                >

                <label class="budget-label">
                    BUDGET
                </label>

                <input
                    type="number"
                    id="player1Budget"
                    placeholder="100000"
                    min="1"
                    step="1"
                    autocomplete="off"
                >

            </div>


            <div class="vs">
                VS
            </div>


            <div class="player-input">

                <label>JOUEUR 2</label>

                <input
                    type="text"
                    id="player2Name"
                    placeholder="Ton nom"
                    maxlength="15"
                    autocomplete="off"
                >

                <label class="budget-label">
                    BUDGET
                </label>

                <input
                    type="number"
                    id="player2Budget"
                    placeholder="100000"
                    min="1"
                    step="1"
                    autocomplete="off"
                >

            </div>

        </div>


        <div class="game-setup-row">

            <div class="mode-choice">

                <label for="gameModeSelect">
                    MODE
                </label>

                <select id="gameModeSelect">
                    <option value="football" selected>
                        FOOTBALL
                    </option>
                    <option value="anime">
                        ANIME
                    </option>
                    <option value="voiture">
                        VOITURE
                    </option>
                </select>

            </div>


            <div class="blind-switch-row">

                <span class="switch-label">
                    AVEUGLE
                </span>

                <label class="switch">
                    <input
                        type="checkbox"
                        id="blindModeSwitch"
                    >
                    <span class="slider"></span>
                </label>

            </div>

        </div>


        <div class="garage-capacity-row">

            <label for="garageCapacity">
                NOMBRE MAX 
            </label>

            <input
                type="number"
                id="garageCapacity"
                placeholder="3"
                min="1"
                max="3"
                step="1"
                autocomplete="off"
            >

        </div>


        <button
            id="startGameButton"
            class="start-game-button"
        >
            COMMENCER
            <span>→</span>
        </button>

    </div>

</section>





<section id="gameScreen" class="game-screen hidden">



    <header class="topbar">

        <div class="logo">

            <span>GARAGE</span>

            <strong>WARS</strong>

        </div>


        <div class="round">

            <small>TOUR</small>

            <strong id="tour">
                1
            </strong>

            <span id="maxTours">
                / 6
            </span>

        </div>


        <div class="player-budgets">

            <div class="budget player-one">

                <span id="player1Label">
                    JOUEUR 1
                </span>

                <strong id="budget1">
                    100 000 €
                </strong>

            </div>


            <div class="budget player-two">

                <span id="player2Label">
                    JOUEUR 2
                </span>

                <strong id="budget2">
                    100 000 €
                </strong>

            </div>

        </div>

    </header>



    

    <main>


       

        <section class="car-showcase">


            <div class="car-number">

                <span id="carNumber">
                    01
                </span>

            </div>


            <div class="car-photo">

                <div class="photo-light"></div>

                <div class="photo-ring ring-one"></div>

                <div class="photo-ring ring-two"></div>


                <div class="photo-dot dot-one"></div>
                <div class="photo-dot dot-two"></div>
                <div class="photo-dot dot-three"></div>
                <div class="photo-dot dot-four"></div>


                <img
                    id="carImage"
                    alt="Voiture"
                    data-ci-type="car"
                    data-ci-width="1200"
                >


                <div
                    id="imagePlaceholder"
                    class="image-placeholder"
                >
                    TIRAGE
                </div>

            </div>



            <div class="car-details">

                <div
                    class="car-brand"
                    id="carBrand"
                >
                    GARAGE
                </div>


                <h1 id="carName">
                    WARS
                </h1>


                <div class="car-meta">

                    <span id="carYear">
                        2020
                    </span>

                    <span>•</span>

                    <span id="category">
                        SPORTIVE
                    </span>

                    <span>•</span>

                    <span id="body">
                        COUPÉ
                    </span>

                </div>

            </div>

        </section>



     

        <section class="auction-panel">


            <div class="auction-status">

                <span class="status-dot"></span>

                <span id="statusText">
                    CHARGEMENT DES VOITURES...
                </span>

            </div>



         

            <div
                id="waitingArea"
                class="auction-content hidden"
            >

                <p class="auction-label">
                    CHOISISSEZ LE PRIX DE DÉPART
                </p>


                <div class="price-input-wrapper">

                    <input
                    type="text"
                    inputmode="numeric"
                     id="startBid"
                    placeholder="0"
>

                    <span>€</span>

                </div>


                <button
                    id="startButton"
                    class="main-button"
                >

                    <span>
                        LANCER L'ENCHÈRE
                    </span>

                    <span class="button-arrow">
                        →
                    </span>

                </button>

            </div>



     

            <div
                id="auctionArea"
                class="auction-content hidden"
            >

                <div class="current-price-label">
                    OFFRE ACTUELLE
                </div>


                <div
                    id="currentPrice"
                    class="current-price"
                >
                    0 €
                </div>


                <div class="turn-player">

                    AU TOUR DE

                    <strong id="currentPlayer">
                        JOUEUR 2
                    </strong>

                </div>


                <div class="bid-actions">

                    <div class="price-input-wrapper small">

                        <input
                            type="number"
                            id="bidInput"
                            placeholder="Votre offre"
                            min="1"
                            step="1"
                        >

                        <span>€</span>

                    </div>


                    <button
                        id="bidButton"
                        class="main-button"
                    >
                        ENCHÉRIR
                    </button>


                    <button
                        id="foldButton"
                        class="fold-button"
                    >
                        SE COUCHER
                    </button>

                </div>

            </div>

        </section>



    

        <section class="garages-section">


            <div class="garage-title">

                <span>
                    COLLECTIONS
                </span>

                <div></div>

            </div>


            <div class="garages">


                <div class="garage">

                    <div class="garage-header">

                        <div>

                            <span id="garageName1">
                                JOUEUR 1
                            </span>

                            <strong id="count1">
                                0 / 5
                            </strong>

                        </div>

                    </div>


                    <div
                        id="garage1"
                        class="garage-cars"
                    ></div>

                </div>



             

                <div class="garage">

                    <div class="garage-header">

                        <div>

                            <span id="garageName2">
                                JOUEUR 2
                            </span>

                            <strong id="count2">
                                0 / 5
                            </strong>

                        </div>

                    </div>


                    <div
                        id="garage2"
                        class="garage-cars"
                    ></div>

                </div>

            </div>

        </section>

    </main>

</section>


<div
    id="blindModeInstruction"
    class="blind-mode-instruction hidden"
></div>




<div
    id="notification"
    class="notification"
></div>


<script src="script.js"></script>

</body>
</html>
